name: ClearPath CI Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Test Assets
        run: |
          python scripts/fetch_assets.py

      - name: Run Environment Diagnostic
        run: |
          python scripts/check_env.py || true

      - name: Validate Contract JSON Schemas
        run: |
          node -e "
          const fs = require('fs');
          const files = ['nodes.json', 'events.json', 'issues.json', 'timeline.json', 'report.json'];
          for (const f of files) {
            JSON.parse(fs.readFileSync('contracts/samples/' + f, 'utf8'));
            console.log('✓ contracts/samples/' + f + ' is valid JSON');
          }
          "

      - name: Test Pipeline Orchestrator (Stub Mode)
        env:
          CP_STUBS: all
        run: |
          python -m worker.pipeline ci-test http://localhost:8080/bad-checkout.html
          test -f data/ci-test/status.json
          test -f data/ci-test/report.json
          grep '"status": "done"' data/ci-test/status.json
          echo "✓ Worker pipeline executed successfully in CI."
